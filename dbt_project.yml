config-version: 2

name: "jaffle_shop"
version: "3.0.0"
require-dbt-version: ">=1.12.0"

profile: jaffle_shop # Put your profile here

model-paths: ["models"]
test-paths: ["data-tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

seeds:
  jaffle_shop:
    +schema: raw
    jaffle-data:
      +enabled: "{{ var('load_source_data', false) }}"

models:
  jaffle_shop:
    staging:
      +materialized: view
    marts:
      +materialized: table
models:
  - name: orders
    description: >
      Order-level fact model with one row per order. Enriches `stg_orders` with
      item-level rollups from `order_items`, including supply cost, item counts,
      food vs. drink flags, and the customer's order sequence number. Use this
      model for order-level reporting and metrics where the grain should stay at
      one record per order.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "order_items_subtotal = subtotal"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "order_total = subtotal + tax_paid"
    columns:
      - name: order_id
        description: Primary key for the order record.
        data_tests:
          - not_null
          - unique
        entity:
          type: primary
      - name: customer_id
        description: Foreign key to the customer who placed the order.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
        entity:
          type: foreign
          name: customer
      - name: order_total
        description: Total order amount in USD, including subtotal and tax.
        dimension:
          type: categorical
          name: order_total_dim
      - name: ordered_at
        description: Timestamp when the order was placed.
        dimension:
          type: time
        granularity: day
      - name: order_cost
        description: Total supply-side fulfillment cost for all items in the order.
      - name: is_food_order
        description: True when the order contains at least one food item.
        dimension:
          type: categorical
      - name: is_drink_order
        description: True when the order contains at least one drink item.
        dimension:
          type: categorical
      - name: location_id
        description: Foreign key to the store or location where the order was placed.
        entity:
          type: foreign
          name: location
      - name: customer_order_number
        description: Sequential number of this order for the customer, ordered by `ordered_at` ascending.
        dimension:
          type: categorical
    semantic_model:
      enabled: true
    agg_time_dimension: ordered_at
    metrics:
      - name: order_cost
        description: Sum of cost for each order item.
        label: Order Cost
        type: simple
        agg: sum
      - name: order_total
        description: Sum of total order amonunt. Includes tax + revenue.
        type: simple
        label: Order Total
        agg: sum
      - name: new_customer_orders
        description: New customer's first order count
        label: New Customers
        type: simple
        filter: |
          {{ Dimension('order_id__customer_order_number') }} = 1
        agg: sum
        expr: 1
      - name: large_orders
        description: "Count of orders with order total over 20."
        type: simple
        label: Large Orders
        filter: |
          {{ Dimension('order_id__order_total_dim') }} >= 20
        agg: sum
        expr: 1
      - name: orders
        description: Count of orders.
        label: Orders
        type: simple
        agg: sum
        expr: 1
      - name: food_orders
        description: Count of orders that contain food order items
        label: Food Orders
        type: simple
        filter: |
          {{ Dimension('order_id__is_food_order') }} = true
        agg: sum
        expr: 1
      - name: drink_orders
        description: Count of orders that contain drink order items
        label: Drink Orders
        type: simple
        filter: |
          {{ Dimension('order_id__is_drink_order') }} = true
        agg: sum
        expr: 1
      - name: tax_paid
        description: The total tax paid on each order.
        agg: sum
        type: simple
        hidden: true
unit_tests:
  - name: test_order_items_compute_to_bools_correctly
    description: "Test that the counts of drinks and food orders convert to booleans properly."
    model: orders
    given:
      - input: ref('order_items')
        rows:
          - {order_id: 1, order_item_id: 1, is_drink_item: false, is_food_item: true}
          - {order_id: 1, order_item_id: 2, is_drink_item: true, is_food_item: false}
          - {order_id: 2, order_item_id: 3, is_drink_item: false, is_food_item: true}
      - input: ref('stg_orders')
        rows:
          - {order_id: 1}
          - {order_id: 2}
    expect:
      rows:
        - {order_id: 1, count_food_items: 1, count_drink_items: 1, is_drink_order: true, is_food_order: true}
        - {order_id: 2, count_food_items: 1, count_drink_items: 0, is_drink_order: false, is_food_order: true}

saved_queries:
  - name: order_metrics
    query_params:
      metrics:
        - orders
        - new_customer_orders
        - order_total
        - food_orders
        - drink_orders
      group_by:
        - TimeDimension('metric_time', 'day')
    exports:
      - name: order_metrics
        config:
          export_as: table

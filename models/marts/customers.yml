models:
  - name: customers
    description: Customer overview data mart, offering key details for each unique customer. One row per customer.
    data_tests:
      - dbt_utils.expression_is_true:
          expression: "lifetime_spend_pretax + lifetime_tax_paid = lifetime_spend"
    columns:
      - name: customer_id
        description: The unique key of the orders mart.
        data_tests:
          - not_null
          - unique
      - name: customer_name
        description: Customers' full name.
      - name: count_lifetime_orders
        description: Total number of orders a customer has ever placed.
      - name: first_ordered_at
        description: The timestamp when a customer placed their first order.
      - name: last_ordered_at
        description: The timestamp of a customer's most recent order.
      - name: lifetime_spend_pretax
        description: The sum of all the pre-tax subtotals of every order a customer has placed.
      - name: lifetime_tax_paid
        description: The sum of all the tax portion of every order a customer has placed.
      - name: lifetime_spend
        description: The sum of all the order totals (including tax) that a customer has ever placed.
      - name: customer_type
        description: Options are 'new' or 'returning', indicating if a customer has ordered more than once or has only placed their first order to date.
        data_tests:
          - accepted_values:
              values: ["new", "returning"]

unit_tests:
  - name: test_customer_type_and_lifetime_totals
    description: >
      Test the three customer shapes the mart has to handle: a customer with no
      orders at all, a customer with exactly one order, and a repeat customer.

      The single-order case pins the boundary in is_repeat_buyer
      (count(distinct order_id) > 1), and the no-order case pins the left join
      to customer_orders_summary. Neither shape is reachable from the existing
      data tests: accepted_values on customer_type passes for any labelling as
      long as both labels are spelled correctly, and the warehouse currently
      holds no customer with zero orders, so an inner join here would produce
      identical output today and silently drop those customers the first time
      one exists.
    model: customers
    given:
      - input: ref('stg_customers')
        rows:
          - { customer_id: "1", customer_name: "Never Ordered" }
          - { customer_id: "2", customer_name: "Single Order" }
          - { customer_id: "3", customer_name: "Repeat Buyer" }
      - input: ref('orders')
        rows:
          - {
              order_id: "a",
              customer_id: "2",
              ordered_at: "2024-01-05 10:00:00",
              subtotal: 10.00,
              tax_paid: 1.00,
              order_total: 11.00,
            }
          - {
              order_id: "b",
              customer_id: "3",
              ordered_at: "2024-01-10 10:00:00",
              subtotal: 20.00,
              tax_paid: 2.00,
              order_total: 22.00,
            }
          - {
              order_id: "c",
              customer_id: "3",
              ordered_at: "2024-02-20 10:00:00",
              subtotal: 30.00,
              tax_paid: 3.00,
              order_total: 33.00,
            }
    expect:
      rows:
        - {
            customer_id: "1",
            customer_name: "Never Ordered",
            count_lifetime_orders: null,
            first_ordered_at: null,
            last_ordered_at: null,
            lifetime_spend_pretax: null,
            lifetime_tax_paid: null,
            lifetime_spend: null,
            customer_type: "new",
          }
        - {
            customer_id: "2",
            customer_name: "Single Order",
            count_lifetime_orders: 1,
            first_ordered_at: "2024-01-05 10:00:00",
            last_ordered_at: "2024-01-05 10:00:00",
            lifetime_spend_pretax: 10.00,
            lifetime_tax_paid: 1.00,
            lifetime_spend: 11.00,
            customer_type: "new",
          }
        - {
            customer_id: "3",
            customer_name: "Repeat Buyer",
            count_lifetime_orders: 2,
            first_ordered_at: "2024-01-10 10:00:00",
            last_ordered_at: "2024-02-20 10:00:00",
            lifetime_spend_pretax: 50.00,
            lifetime_tax_paid: 5.00,
            lifetime_spend: 55.00,
            customer_type: "returning",
          }

semantic_models:
  - name: customers
    defaults:
      agg_time_dimension: first_ordered_at
    description: |
      Customer grain mart.
    model: ref('customers')
    entities:
      - name: customer
        expr: customer_id
        type: primary
    dimensions:
      - name: customer_name
        type: categorical
      - name: customer_type
        type: categorical
      - name: first_ordered_at
        type: time
        type_params:
          time_granularity: day
      - name: last_ordered_at
        type: time
        type_params:
          time_granularity: day
    measures:
      - name: customers
        description: Count of unique customers
        agg: count_distinct
        expr: customer_id
      - name: count_lifetime_orders
        description: Total count of orders per customer.
        agg: sum
      - name: lifetime_spend_pretax
        description: Customer lifetime spend before taxes.
        agg: sum
      - name: lifetime_spend
        agg: sum
        description: Gross customer lifetime spend inclusive of taxes.

metrics:
  - name: lifetime_spend_pretax
    description: Customer's lifetime spend before tax
    label: LTV Pre-tax
    type: simple
    type_params:
      measure: lifetime_spend_pretax
  - name: count_lifetime_orders
    description: Count of lifetime orders
    label: Count Lifetime Orders
    type: simple
    type_params:
      measure: count_lifetime_orders
  - name: average_order_value
    description: LTV pre-tax / number of orders
    label: Average Order Value
    type: derived
    type_params:
      metrics:
        - count_lifetime_orders
        - lifetime_spend_pretax
      expr: lifetime_spend_pretax / count_lifetime_orders

saved_queries:
  - name: customer_order_metrics
    query_params:
      metrics:
        - count_lifetime_orders
        - lifetime_spend_pretax
        - average_order_value
      group_by:
        - Entity('customer')
    exports:
      - name: customer_order_metrics
        config:
          export_as: table

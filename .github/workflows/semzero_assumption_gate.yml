name: SemZero Assumption Gate

on:
  pull_request:
    paths:
      - "models/**/*.sql"
      - "models/**/*.yml"
      - "models/**/*.yaml"
      - "macros/**/*.sql"
      - "dbt_project.yml"
      - ".semzero/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  semzero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hiteshsundraaa/semzero-public-alpha-launch@3e63dd0a1e0fa35eca06753c68789f7605455141
        with:
          mode: shadow
          run-dbt-compile: "true"
          extra-pip-packages: "dbt-core dbt-duckdb"
          dbt-profiles-dir: ".semzero"
